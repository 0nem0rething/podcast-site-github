<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--SITE_META_START-->
<title>One More Thing.</title>
<meta name="description" content="A short line about what your show is about.">
<meta property="og:type" content="website">
<meta property="og:title" content="One More Thing.">
<meta property="og:description" content="A short line about what your show is about.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f6f6f3">
<meta name="apple-mobile-web-app-title" content="One More Thing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!--SITE_META_END-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script>try{var m=localStorage.getItem('pc:mode');document.documentElement.dataset.theme=(m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#episodes">Skip to episodes</a>
<div class="wrap">
  <header class="site-header">
    <img id="logo" alt="" width="64" height="64" hidden>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch colour mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main id="main">
    <section class="hero" aria-label="Introduction">
      <h1 id="site-name"></h1>
      <p id="tagline" class="tagline" hidden></p>
    </section>
    <section id="about" class="about" aria-label="About" hidden></section>
    <section aria-labelledby="eps-h">
      <div class="eps-head">
        <h2 id="eps-h">All episodes</h2>
        <span id="order-label" class="order-label"></span>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Loading…</p>
      <ol id="episodes" class="episodes list"></ol>
    </section>
    <div id="hint" class="hint" role="note" hidden>
      <div>
        <p class="hint-title">Listen on your iPhone</p>
        <p id="hint-text"></p>
      </div>
      <button id="hint-close" class="icon-btn" type="button" aria-label="Dismiss hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </main>
</div>

<div id="player" class="player" role="region" aria-label="Audio player" hidden>
  <div class="player-inner">
    <div class="player-now">
      <img id="p-cover" alt="" width="44" height="44">
      <div>
        <p id="p-title"></p>
        <p id="p-sub"></p>
      </div>
    </div>
    <div class="player-main">
      <div class="player-seek">
        <span id="p-cur">0:00</span>
        <input id="p-seek" type="range" min="0" max="0" step="any" value="0" aria-label="Seek">
        <span id="p-dur">0:00</span>
      </div>
      <div class="player-controls">
        <button id="p-prev" class="icon-btn" type="button" aria-label="Previous episode"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
        <button id="p-back" class="icon-btn" type="button" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="15" stroke-width="0">15</text></svg></button>
        <button id="p-play" class="play-btn" type="button" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button id="p-fwd" class="icon-btn" type="button" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/><text x="12" y="15" stroke-width="0">30</text></svg></button>
        <button id="p-next" class="icon-btn" type="button" aria-label="Next episode"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
        <button id="p-speed" class="speed" type="button" aria-label="Playback speed 1x">1×</button>
      </div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>
<script src="app.js" defer></script>
</body>
</html>
